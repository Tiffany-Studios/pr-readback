name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The tests read action.yml and execute the script it actually ships, so
      # they cannot drift from it by being a copy that someone forgot to update.
      - name: node --test
        run: node --test test/*.test.js
